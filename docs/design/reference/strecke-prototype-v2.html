<title>Strecke Prototyp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout concept: one phone screen in three fixed zones (route on top, card in the middle, actions at the thumb).
   Colour is assigned by meaning: amber = what you must retrieve, teal = secure, fog = not yet, ink = certainty. */
:root{
  --outer:#D6DCE8; --ground:#F1F4F9; --card:#FFFFFF; --edge:#D3DAE6; --line:#BFC8DA;
  --ink:#111A36; --ink2:#52607E; --amber:#FF8A1F; --amber-edge:#D4620A; --on-amber:#111A36;
  --teal:#0A9A74; --fog:#C5CDDD; --fog-ink:#76829C; --halo:rgba(17,26,54,.16); --mid:#4C6BFF;
  --f-display:'Barlow Semi Condensed','Arial Narrow',Arial,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ease:cubic-bezier(.22,.9,.28,1.02);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --outer:#060A15; --ground:#0C1328; --card:#152042; --edge:#25335C; --line:#33447A;
    --ink:#F0F3FF; --ink2:#9BA8CB; --amber:#FF9A33; --amber-edge:#FFBE6B; --on-amber:#0C1328;
    --teal:#35DBA6; --fog:#37446A; --fog-ink:#8A97BA; --halo:rgba(240,243,255,.2); --mid:#8EA2FF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
--outer:#060A15; --ground:#0C1328; --card:#152042; --edge:#25335C; --line:#33447A;
    --ink:#F0F3FF; --ink2:#9BA8CB; --amber:#FF9A33; --amber-edge:#FFBE6B; --on-amber:#0C1328;
    --teal:#35DBA6; --fog:#37446A; --fog-ink:#8A97BA; --halo:rgba(240,243,255,.2); --mid:#8EA2FF;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--outer);color:var(--ink);font-family:var(--f-body);font-size:16px;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#stage{height:100%}
#app{height:100%;max-width:440px;margin:0 auto;box-sizing:border-box;display:flex;flex-direction:column;
  padding:8px 18px 18px;background:var(--ground);position:relative;overflow:hidden}
@media (min-width:620px){
  #stage{display:grid;place-items:center}
  #app{width:390px;height:min(844px,100%);border:1px solid var(--edge);border-radius:28px}
}
button{font:inherit;color:inherit;-webkit-appearance:none;appearance:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
button:active:not(:disabled){transform:scale(.975)}

/* top: run label, leave, route */
.top{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.run{font:600 13px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.quiet{background:none;border:0;color:var(--ink2);font:500 15px var(--f-body);min-height:44px;padding:0 4px}
.route{list-style:none;margin:0;padding:0 2px;display:flex;align-items:center}
.stop{display:flex;align-items:center;flex:1}
.stop:last-child{flex:0}
.stop i{display:block;width:16px;height:16px;border-radius:50%;border:2px solid var(--line);box-sizing:border-box;
  transition:background .35s,border-color .35s,box-shadow .35s}
.stop:not(:last-child)::after{content:"";flex:1;height:2px;background:var(--line);margin:0 5px;transition:background .5s}
.stop.done:not(:last-child)::after{background:var(--ink2)}
.stop.cur i{border-color:var(--ink);box-shadow:0 0 0 4px var(--halo)}
.stop.g0 i{background:var(--fog);border-color:var(--fog)}
.stop.g1 i{background:var(--amber);border-color:var(--amber)}
.stop.g2 i{background:var(--mid);border-color:var(--mid)}
.stop.g3 i{background:var(--teal);border-color:var(--teal)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.4)}100%{transform:scale(1)}}
.stop.pop i{animation:pop .42s var(--ease)}

/* card zone */
.mid{flex:1;display:flex;margin:10px 0 14px;min-height:0;min-width:0}
.card{flex:0 1 auto;width:100%;min-width:0;max-height:100%;margin:auto 0;box-sizing:border-box;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--edge);border-radius:10px;
  box-shadow:0 4px 0 var(--edge);padding:24px 20px 16px;min-height:0;position:relative}
.card.cl{min-height:300px}
.front{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0;width:100%}
.art{font:600 15px/1 var(--f-body);border:1.5px solid var(--ink);border-radius:4px;padding:4px 9px;margin-bottom:6px}
.word{margin:0;font:700 72px/1 var(--f-display);letter-spacing:-.01em;white-space:nowrap;width:100%}
.pl{margin:2px 0 0;color:var(--ink2);font:400 16px var(--f-body)}
.ex{margin:16px 0 0;font:500 24px/1.3 var(--f-body)}
.ex u{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}
.zone{margin-top:28px;position:relative;perspective:900px;min-height:190px;display:flex}
.back{flex:1;padding:12px 4px 4px;opacity:0;display:flex;flex-direction:column;gap:10px;align-items:flex-start;transition:opacity .3s}
.mean{margin:0;font:600 44px/1.05 var(--f-display)}
.more{background:none;border:0;border-bottom:2px solid var(--line);padding:6px 0 4px;color:var(--ink2);font:500 15px var(--f-body);min-height:32px}
.extra{display:flex;flex-direction:column;gap:6px}
.extra[hidden]{display:none}
.tr{margin:0;color:var(--ink2);font:400 17px/1.35 var(--f-body)}
.col{margin:0;font:600 17px var(--f-body)}
.flap{position:absolute;inset:0;border:0;padding:0;border-radius:6px;background:var(--amber);border-bottom:3px solid var(--amber-edge);
  transform-origin:50% 0;touch-action:none;display:grid;place-items:center;color:var(--on-amber);will-change:transform}
.flap .chev{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.cut,.fold{position:absolute;right:0;bottom:-3px;width:34px;height:34px}
.cut{background:var(--card);clip-path:polygon(100% 0,100% 100%,0 100%)}
.fold{background:var(--amber-edge);clip-path:polygon(0 0,100% 0,0 100%)}

/* cloze */
.q{margin:0;font:600 40px/1.2 var(--f-display)}
.qtr{margin:14px 0 0;color:var(--ink2);font:400 17px/1.35 var(--f-body)}
.slot{display:inline-block;min-width:4.6em;height:1.05em;vertical-align:-.14em;border:2.5px solid var(--amber-edge);border-radius:5px;
  background:color-mix(in srgb,var(--amber) 24%,transparent);text-align:center;line-height:1;padding:0 .2em;box-sizing:border-box;
  transition:border-color .3s,background .3s}
.slot.right{border-color:var(--teal);background:transparent}
.slot.shown{border-color:var(--ink);background:transparent}
.fly{position:fixed;left:0;top:0;z-index:9;font:600 36px/1 var(--f-display);pointer-events:none;white-space:nowrap;transform-origin:0 50%;color:var(--ink)}

/* actions */
.act{display:flex;flex-direction:column;gap:10px}
.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ch{min-width:0;height:84px;border:2px solid var(--line);background:var(--card);border-radius:10px;font:600 14px/1.15 var(--f-body);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:0 2px;transition:border-color .3s,color .3s,background .3s}
.ch .st{display:flex;align-items:flex-end;gap:3px;height:20px}
.ch .st b{display:block;width:6px;border-radius:2px;background:var(--fog)}
.ch .st b.on{background:var(--c)}
.ch[data-g="0"]{--c:var(--fog-ink)}.ch[data-g="1"]{--c:var(--amber)}.ch[data-g="2"]{--c:var(--mid)}.ch[data-g="3"]{--c:var(--teal)}
.ch:not(:disabled){border-color:var(--c)}
.ch:not(:disabled):active{background:color-mix(in srgb,var(--c) 14%,var(--card))}
.ch.sel{background:var(--c);border-color:var(--c);color:#fff}
.ch.sel .st b.on{background:#fff}
.ch:disabled{border-color:var(--edge);color:var(--fog-ink);cursor:default}
.ch:disabled .st b.on{background:var(--fog)}
.tags{display:flex;flex-direction:column;gap:8px}
.tag{height:50px;border:2px solid var(--ink);border-radius:8px;background:transparent;font:600 22px var(--f-display);
  text-align:left;padding:0 16px;display:flex;align-items:center;justify-content:space-between;transition:border-color .3s,color .3s,background .3s}
.tag:disabled{cursor:default}
.tag.right{border-color:var(--teal);color:var(--teal)}
.tag.miss{border-color:var(--fog);background:var(--fog);color:var(--ink2)}
.primary{height:58px;border:0;border-radius:8px;background:var(--ink);color:var(--ground);font:600 18px var(--f-body);transition:background .3s,color .3s}
.primary:disabled{background:var(--fog);color:var(--fog-ink);cursor:default}
.ghost{height:52px;border:2px solid var(--line);background:none;border-radius:8px;font:500 17px var(--f-body)}

/* summary, week, end */
.sum{flex:1;display:flex;flex-direction:column;padding-top:22px;min-height:0}
.sum h1{margin:0;font:700 46px/1 var(--f-display)}
.kicker{margin:30px 0 8px;font:600 13px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.stats{margin:0;display:flex;flex-direction:column}
.stats div{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--ink);padding:12px 0 8px}
.stats dt{font:500 18px var(--f-body)}
.stats dd{margin:0;font:700 44px/1 var(--f-display);font-variant-numeric:tabular-nums}
.stats .sec dd{color:var(--teal)}
.link{align-self:flex-start;margin-top:18px;background:none;border:0;border-bottom:2px solid var(--ink);padding:6px 0;font:600 17px var(--f-body)}
.chart{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:150px;margin:14px 0 24px}
.day{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;height:100%}
.stack{display:flex;flex-direction:column-reverse;gap:4px}
.stack i{display:block;width:22px;height:14px;border-radius:3px;background:var(--ink)}
.day span{font:600 13px var(--f-body);color:var(--ink2);letter-spacing:.08em;text-transform:uppercase;padding-bottom:2px;border-bottom:2px solid transparent}
.day.today span{color:var(--ink);border-bottom-color:var(--ink)}
.end{flex:1;display:flex;flex-direction:column;justify-content:center}
.end h1{margin:0;font:700 56px/1 var(--f-display)}

@keyframes inn{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.enter{animation:inn .52s var(--ease) both}
@media (max-height:660px){
  .zone{min-height:130px;margin-top:16px} .mean{font-size:36px} .ex{font-size:20px;margin-top:10px} .q{font-size:30px} .card.cl{min-height:200px} .card{padding:18px 16px 12px}
  .tag{height:44px} .primary{height:52px} .ch{height:74px;font-size:13px} .sum h1{font-size:38px} .stats dd{font-size:36px}
}
@media (prefers-reduced-motion:reduce){
  .enter{animation:fade .2s both}
  .flap .chev,.stop.pop i{animation:none}
  *{transition-duration:.01ms!important}
}
</style>

<div id="stage"><div id="app"></div></div>

<script>
(function(){
'use strict';
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var vib=function(ms){try{if(navigator.vibrate)navigator.vibrate(ms)}catch(e){}};
var app=$('#app');
var EASE='cubic-bezier(.22,.9,.28,1.02)';
var CHECK='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>';
var CHEV='<svg class="chev" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg>';

var CARDS=[
 {t:'k',art:'die',w:'Anmeldung',pl:'Anmeldungen',ex:['Für die ','Anmeldung',' brauche ich meinen Pass.'],mean:'registration',tr:'I need my passport for the registration.',col:'die Anmeldung ausfüllen'},
 {t:'c',before:'Der Zug hat zwanzig Minuten ',after:'.',tr:'The train is twenty minutes late.',ans:'Verspätung',opts:['Abfahrt','Verspätung','Haltestelle']},
 {t:'k',art:'der',w:'Termin',pl:'Termine',ex:['Ich habe morgen einen ','Termin',' beim Arzt.'],mean:'appointment',tr:"Tomorrow I have an appointment at the doctor's.",col:'einen Termin machen'},
 {t:'k',art:'Adj.',w:'zuständig',pl:'',ex:['Dafür bin ich leider nicht ','zuständig','.'],mean:'responsible',tr:"Unfortunately I'm not responsible for that.",col:'zuständig für'},
 {t:'c',before:'Wir müssen am Hauptbahnhof ',after:'.',tr:'We have to change trains at the main station.',ans:'umsteigen',opts:['aussteigen','umsteigen','einsteigen']},
 {t:'k',art:'die',w:'Krankenkasse',pl:'Krankenkassen',ex:['Meine ','Krankenkasse',' zahlt das nicht.'],mean:'health insurance',tr:"My health insurance doesn't pay for that.",col:'bei einer Krankenkasse versichert sein'}
];
/* demo history before this run (illustrative numbers) */
var T={today:{runs:4,cards:21,secure:3},week:{runs:13,cards:72,secure:10},days:[3,4,2,4,0,0,0]};
var runNo=5,S;
function fresh(){S={screen:'run',i:0,phase:'front',results:[],run:runNo,busy:false}}
fresh();

function stops(cur){
  var n=CARDS.length,h='<ol class="route" aria-label="Karte '+Math.min(S.i+1,n)+' von '+n+'">';
  for(var k=0;k<n;k++){
    var done=k<S.results.length;
    var cls=done?('done '+('g'+S.results[k])):(k===cur?'cur':'');
    h+='<li class="stop '+cls+'"><i></i></li>';
  }
  return h+'</ol>';
}
function topRun(){return '<header class="top"><div class="row"><span class="run">Runde '+S.run+'</span><button class="quiet" id="done">Fertig</button></div>'+stops(S.i)+'</header>'}
function topSum(){return '<header class="top"><div class="row"><span class="run">Runde '+S.run+'</span><span></span></div>'+stops(-1)+'</header>'}

function karteHTML(c){
  return '<main class="mid"><section class="card enter"><div class="front"><span class="art">'+c.art+'</span>'+
  '<h1 class="word" id="word">'+c.w+'</h1>'+(c.pl?'<p class="pl">Pl. '+c.pl+'</p>':'')+
  '<p class="ex">'+c.ex[0]+'<u>'+c.ex[1]+'</u>'+c.ex[2]+'</p></div>'+
  '<div class="zone" id="zone"><div class="back" id="back" aria-hidden="true"><p class="mean">'+c.mean+'</p>'+
  '<button class="more" id="more" aria-expanded="false">Mehr</button>'+
  '<div class="extra" id="extra" hidden><p class="tr">'+c.tr+'</p><p class="col">'+c.col+'</p></div></div>'+
  '<button class="flap" id="flap" aria-label="Bedeutung aufdecken">'+CHEV+'<span class="cut"></span><span class="fold"></span></button></div>'+
  '</section></main><footer class="act enter"><div class="choices"><button class="ch" id="g0" data-g="0" disabled><span class="st"><b class="on" style="height:6px"></b><b class="" style="height:10px"></b><b class="" style="height:15px"></b><b class="" style="height:20px"></b></span>Nicht gewusst</button><button class="ch" id="g1" data-g="1" disabled><span class="st"><b class="on" style="height:6px"></b><b class="on" style="height:10px"></b><b class="" style="height:15px"></b><b class="" style="height:20px"></b></span>Teilweise</button><button class="ch" id="g2" data-g="2" disabled><span class="st"><b class="on" style="height:6px"></b><b class="on" style="height:10px"></b><b class="on" style="height:15px"></b><b class="" style="height:20px"></b></span>Gewusst</button><button class="ch" id="g3" data-g="3" disabled><span class="st"><b class="on" style="height:6px"></b><b class="on" style="height:10px"></b><b class="on" style="height:15px"></b><b class="on" style="height:20px"></b></span>Sofort</button></div></footer>';
}
function clozeHTML(c){
  return '<main class="mid"><section class="card cl enter"><div class="front"><p class="q">'+c.before+'<span class="slot" id="slot" aria-label="Lücke"></span>'+c.after+'</p>'+
  '<p class="qtr">'+c.tr+'</p></div></section></main><footer class="act enter"><div class="tags">'+
  c.opts.map(function(o){return '<button class="tag" data-o="'+o+'"><span>'+o+'</span></button>'}).join('')+
  '</div><button class="primary" id="next" disabled>Weiter</button></footer>';
}
function stat(label,val,cls){return '<div'+(cls?' class="'+cls+'"':'')+'><dt>'+label+'</dt><dd>'+val+'</dd></div>'}

function render(){
  if(S.screen==='run'){
    var c=CARDS[S.i];
    app.innerHTML=topRun()+(c.t==='k'?karteHTML(c):clozeHTML(c));
    $('#done').onclick=leaveRun;
    if(c.t==='k')bindKarte();else bindCloze();
    fit();
  }else if(S.screen==='sum'){
    app.innerHTML=topSum()+'<main class="sum enter"><h1>Das war Runde '+S.run+'.</h1><p class="kicker">Heute</p><dl class="stats">'+
      stat('Runden',T.today.runs)+stat('Karten',T.today.cards)+stat('Wörter sicherer',T.today.secure,'sec')+'</dl>'+
      '<button class="link" id="week">Diese Woche ansehen</button></main>'+
      '<footer class="act enter"><button class="primary" id="again">Noch eine Runde</button><button class="ghost" id="end">Fertig</button></footer>';
    $('#week').onclick=function(){S.screen='week';render()};
    $('#again').onclick=function(){runNo++;fresh();render()};
    $('#end').onclick=function(){S.screen='end';render()};
  }else if(S.screen==='week'){
    var names=['Mo','Di','Mi','Do','Fr','Sa','So'];
    var cols=names.map(function(d,k){var n=T.days[k];var sq='';for(var j=0;j<n;j++)sq+='<i></i>';
      return '<div class="day'+(k===3?' today':'')+'"><div class="stack">'+sq+'</div><span>'+d+'</span></div>'}).join('');
    app.innerHTML='<header class="top"><div class="row"><button class="quiet" id="back2">Zurück</button><span class="run">Diese Woche</span></div></header>'+
      '<main class="sum enter"><div class="chart" role="img" aria-label="Runden pro Tag">'+cols+'</div><dl class="stats">'+
      stat('Runden',T.week.runs)+stat('Karten',T.week.cards)+stat('Wörter sicherer',T.week.secure,'sec')+'</dl></main>';
    $('#back2').onclick=function(){S.screen='sum';render()};
  }else{
    app.innerHTML='<main class="end enter"><h1>Bis gleich.</h1></main><footer class="act enter"><button class="ghost" id="restart">Neu starten</button></footer>';
    $('#restart').onclick=function(){runNo=5;fresh();render()};
  }
}
function commit(){
  var n=S.results.length;if(!n)return;
  var sec=S.results.filter(function(g){return g>=2}).length;
  T.today.runs++;T.today.cards+=n;T.today.secure+=sec;
  T.week.runs++;T.week.cards+=n;T.week.secure+=sec;T.days[3]++;
}
function leaveRun(){
  if(S.busy)return;
  if(!S.results.length){S.screen='end'}else{commit();S.screen='sum'}
  render();
}
function markStop(known){
  var li=$$('.stop');var k=S.results.length-1;
  li[k].classList.remove('cur');li[k].classList.add('done','g'+known,'pop');
  if(li[k+1])li[k+1].classList.add('cur');
}
function leave(cb){
  var d=reduce?160:300,card=$('.card'),act=$('.act');
  if(card)card.animate(reduce?[{opacity:1},{opacity:0}]:[{transform:'none',opacity:1},{transform:'translateX(-30px)',opacity:0}],{duration:d,easing:'ease-in',fill:'forwards'});
  if(act)act.animate([{opacity:1},{opacity:0}],{duration:d,easing:'ease-in',fill:'forwards'});
  setTimeout(cb,d+20);
}
function after(){
  if(S.i>=CARDS.length){commit();S.screen='sum';S.busy=false;render()}
  else{S.phase='front';S.busy=false;render()}
}
function fit(){
  var w=$('#word');if(!w)return;var s=72;w.style.fontSize=s+'px';
  while(w.scrollWidth>w.clientWidth+1&&s>30){s-=2;w.style.fontSize=s+'px'}
}
window.addEventListener('resize',fit);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);

function bindKarte(){
  var flap=$('#flap'),back=$('#back'),chs=$$('.ch');
  var sy=null,moved=0,peel=0;
  function set(a){peel=a;flap.style.transform='rotateX('+a+'deg)';back.style.opacity=String(Math.min(1,a/55))}
  function open(){
    if(S.phase!=='front')return;S.phase='back';vib(12);
    var a=peel;back.setAttribute('aria-hidden','false');back.style.opacity='1';
    if(reduce){flap.style.display='none'}
    else{
      var an=flap.animate([{transform:'rotateX('+a+'deg)',opacity:1},{transform:'rotateX(90deg)',opacity:1,offset:.85},{transform:'rotateX(90deg)',opacity:0}],{duration:560,easing:EASE,fill:'forwards'});
      an.onfinish=function(){flap.style.display='none'};
    }
    chs.forEach(function(b){b.disabled=false});
  }
  flap.addEventListener('pointerdown',function(e){
    if(S.phase!=='front'||S.busy)return;
    sy=e.clientY;moved=0;try{flap.setPointerCapture(e.pointerId)}catch(x){}
    flap.style.transition='none';
  });
  flap.addEventListener('pointermove',function(e){
    if(sy===null)return;var dy=sy-e.clientY;moved=Math.max(moved,Math.abs(dy));
    set(Math.max(0,Math.min(70,dy*0.8)));
  });
  flap.addEventListener('pointerup',function(){
    if(sy===null)return;sy=null;
    if(moved<8||peel>28)open();
    else{flap.style.transition='transform 360ms '+EASE;set(0)}
  });
  flap.addEventListener('pointercancel',function(){
    if(sy===null)return;sy=null;flap.style.transition='transform 360ms '+EASE;set(0);
  });
  flap.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}});
  function decide(g,b){
    if(S.busy||S.phase!=='back')return;S.busy=true;vib(10);
    b.classList.add('sel');chs.forEach(function(x){x.disabled=true});
    S.results.push(g);markStop(g);
    setTimeout(function(){leave(function(){S.i++;after()})},reduce?60:240);
  }
  chs.forEach(function(b){b.onclick=function(){decide(+b.dataset.g,b)}});
  var more=$('#more'),extra=$('#extra');
  more.onclick=function(){var h=extra.hidden;extra.hidden=!h;more.textContent=h?'Weniger':'Mehr';more.setAttribute('aria-expanded',String(h))};
}

function bindCloze(){
  var next=$('#next');
  $$('.tag').forEach(function(b){b.onclick=function(){pick(b)}});
  next.onclick=function(){
    if(S.phase!=='back'||S.busy)return;S.busy=true;
    leave(function(){S.i++;after()});
  };
}
function pick(btn){
  if(S.phase!=='front'||S.busy)return;S.busy=true;
  var c=CARDS[S.i],o=btn.dataset.o,ok=(o===c.ans),slot=$('#slot'),tags=$$('.tag');
  tags.forEach(function(t){t.disabled=true});
  function settle(){
    slot.textContent=c.ans;slot.classList.add(ok?'right':'shown');
    tags.forEach(function(t){
      if(t.dataset.o===c.ans){t.classList.add('right');t.insertAdjacentHTML('beforeend',CHECK)}
      else if(t===btn){t.classList.add('miss')}
    });
    var g=ok?2:0;S.results.push(g);markStop(g);S.phase='back';S.busy=false;$('#next').disabled=false;vib(10);
  }
  if(reduce){settle();return}
  var a=btn.getBoundingClientRect(),b=slot.getBoundingClientRect();
  var fly=document.createElement('span');fly.className='fly';fly.textContent=o;document.body.appendChild(fly);
  var fw=fly.getBoundingClientRect(),sc=22/36;
  var from='translate('+(a.left+16)+'px,'+(a.top+a.height/2-fw.height/2)+'px) scale('+sc+')';
  var to='translate('+(b.left+(b.width-fw.width)/2)+'px,'+(b.top+(b.height-fw.height)/2)+'px) scale(1)';
  btn.style.opacity='.35';
  var a1=fly.animate([{transform:from},{transform:to}],{duration:420,easing:EASE,fill:'forwards'});
  a1.onfinish=function(){
    if(ok){fly.remove();btn.style.opacity='';settle()}
    else{setTimeout(function(){
      var a2=fly.animate([{transform:to,opacity:1},{transform:from,opacity:0}],{duration:360,easing:'ease-in-out',fill:'forwards'});
      a2.onfinish=function(){fly.remove();btn.style.opacity='';settle()};
    },180)}
  };
}
render();
})();
</script>
